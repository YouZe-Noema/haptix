[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haptix"
version = "0.1.0"
description = "Tactile data infrastructure: unified format, dataset tools, and ML pipeline integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ronald Xia", email = "ronald@haptix.dev"}
]
keywords = ["tactile", "haptics", "robotics", "machine-learning", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]
all = ["haptix[torch,jax]", "h5py>=3.0", "zarr>=2.0"]
dev = ["haptix[all]", "pytest>=7.0", "pytest-cov", "black", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/ronaldxia/haptix"
Repository = "https://github.com/ronaldxia/haptix"

[tool.setuptools.packages.find]
include = ["haptix*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

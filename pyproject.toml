[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haptix"
version = "0.2.0"
description = "Tactile data infrastructure: unified format, dataset tools, and ML pipeline integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Ronald Xia", email = "ronald@haptix.dev"}
]
keywords = ["tactile", "haptics", "robotics", "machine-learning", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = [
    "streamlit>=1.30",
    "plotly>=5.20",
]
torch = [
    "torch>=2.0",
    # torch <2.4 wheels were built against numpy 1.x; numpy 2.x breaks
    # torch.from_numpy with "Numpy is not available" RuntimeError on py3.10/3.11
    "numpy<2.0; python_version < '3.12'",
]
jax = ["jax>=0.4"]
all = ["haptix[torch,jax]", "h5py>=3.0", "zarr>=2.0"]
dev = ["haptix[all]", "pytest>=7.0", "pytest-cov", "black", "ruff", "mypy"]

[project.scripts]
haptix-browser = "haptix.browser.cli:main"

[project.urls]
Homepage = "https://github.com/YouZe-Noema/haptix"
Repository = "https://github.com/YouZe-Noema/haptix"

[tool.setuptools.packages.find]
include = ["haptix*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

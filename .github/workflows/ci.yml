name: haptix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --tb=short

      - name: Re-run tests across fixed RNG seeds
        if: matrix.python-version == '3.12'
        run: |
          for seed in 1 2 3; do
            echo "--- HAPTIX_TEST_SEED=$seed ---"
            HAPTIX_TEST_SEED=$seed pytest -q --tb=short
          done

      - name: Verify round-trip guarantee
        run: |
          echo "Running round-trip tests..."
          pytest tests/test_roundtrip.py -v -k roundtrip || exit 1
          echo "✅ All round-trip tests passed — lossless guarantee verified"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pip install ruff==0.16.0 black==24.10.0
          ruff check haptix/ tests/ scripts/
          black --check haptix/ tests/ scripts/

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Type-check
        run: |
          pip install --upgrade pip
          # numpy>=2.5 ships PEP 695 ``type`` aliases in its bundled stubs
          # (numpy/__init__.pyi), which mypy cannot parse under the
          # python_version="3.10" target configured in pyproject.toml — the run
          # dies with "Type statement is only supported in Python 3.12 and
          # greater [syntax]" and exit code 2. Pin the type-check environment
          # below that boundary; the runtime test matrix still exercises the
          # newest numpy.
          pip install -e . "mypy==2.3.1" "numpy<2.5"
          mypy haptix/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      # Installs the built wheel into a clean venv with NO extras, then imports
      # and round-trips — catches missing py.typed / subpackages / broken
      # console_scripts that twine check alone would miss.
      - name: Smoke-test the built wheel (core only, no extras)
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/wheel-smoke/bin/python scripts/wheel_smoke.py

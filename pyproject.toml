[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77: PEP 639 license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "haptix"
version = "0.2.0"
description = "Tactile data infrastructure: unified format, dataset tools, and ML pipeline integration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Ronald Xia", email = "ronald@haptix.dev"}
]
keywords = ["tactile", "haptics", "robotics", "machine-learning", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = [
    "streamlit>=1.30",
    "plotly>=5.20",
]
torch = [
    "torch>=2.0",
    # torch <2.4 wheels were built against numpy 1.x; numpy 2.x breaks
    # torch.from_numpy with "Numpy is not available" RuntimeError on py3.10/3.11
    "numpy<2.0; python_version < '3.12'",
]
jax = ["jax>=0.4"]
all = ["haptix[torch,jax,browser]", "h5py>=3.0", "zarr>=2.0"]
dev = ["haptix[all]", "pytest>=7.0", "pytest-cov", "black==24.10.0", "ruff==0.16.0", "mypy", "tomli; python_version < '3.11'"]

[project.scripts]
haptix-browser = "haptix.browser.cli:main"

[project.urls]
Homepage = "https://github.com/YouZe-Noema/haptix"
Repository = "https://github.com/YouZe-Noema/haptix"
Documentation = "https://github.com/YouZe-Noema/haptix/blob/main/docs/api.md"
Issues = "https://github.com/YouZe-Noema/haptix/issues"

[tool.setuptools.packages.find]
include = ["haptix*"]

[tool.setuptools.package-data]
haptix = ["py.typed"]

[tool.mypy]
files = ["haptix"]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Optional / untyped third-party packages whose install state and syntax vary by
# environment (zarr 3.x uses PEP 695, which a 3.10 target cannot parse). Skipping
# them keeps the gate reproducible whether or not the extras are installed.
[[tool.mypy.overrides]]
module = [
    "cv2",
    "h5py", "h5py.*",
    "jax", "jax.*",
    "numcodecs", "numcodecs.*",
    "pandas", "pandas.*",
    "plotly", "plotly.*",
    "streamlit", "streamlit.*",
    "torch", "torch.*",
    "tqdm", "tqdm.*",
    "zarr", "zarr.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
